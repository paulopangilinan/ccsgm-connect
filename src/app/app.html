<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-20 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:font-semibold focus:text-brand-700 focus:shadow-lg dark:focus:bg-surface-dark dark:focus:text-brand-200"
>
  Skip to content
</a>

<div class="min-h-screen bg-gradient-to-b from-brand-50 via-white to-white text-slate-900 dark:from-surface-dark dark:via-surface-dark dark:to-surface-dark dark:text-slate-100">
  <header class="sticky top-0 z-10 border-b border-brand-100/70 bg-white/70 backdrop-blur dark:border-white/5 dark:bg-surface-dark/70">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <a routerLink="/" class="flex items-center gap-2 text-lg font-extrabold tracking-tight text-brand-700 dark:text-brand-200">
        <img ngSrc="images/ccsgm-logo.png" width="90" height="90" priority alt="" class="h-8 w-8 rounded-full" />
        CCSGM Connect
      </a>
      <div class="flex items-center gap-3">
        @if (session.isElder()) {
          <label
            class="group relative h-8 w-8 shrink-0 cursor-pointer rounded-full"
            [class.opacity-60]="uploadingAvatar()"
            [attr.aria-label]="session.profile()?.avatarUrl ? 'Change your photo' : 'Add your photo'"
            [title]="session.profile()?.avatarUrl ? 'Change your photo' : 'Add your photo'"
          >
            @if (session.profile()?.avatarUrl) {
              <img
                [src]="session.profile()!.avatarUrl"
                [alt]="session.profile()?.name ?? 'Your profile photo'"
                referrerpolicy="no-referrer"
                class="h-8 w-8 rounded-full border border-brand-100 object-cover dark:border-white/10"
              />
            } @else {
              <span
                class="grid h-8 w-8 place-items-center rounded-full border border-dashed border-brand-300 bg-brand-50 text-brand-500 dark:border-white/20 dark:bg-white/5 dark:text-brand-300"
                aria-hidden="true"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                  <circle cx="12" cy="13" r="4" />
                </svg>
              </span>
            }
            <input type="file" accept="image/*" class="sr-only" [disabled]="uploadingAvatar()" (change)="onElderAvatarSelected($event)" />
          </label>
        }
        @if (session.isAuthenticated()) {
          <button
            type="button"
            (click)="signOut()"
            aria-label="Sign out"
            class="inline-flex items-center gap-2 rounded-full border border-brand-200 p-2 text-sm font-semibold text-brand-700 transition hover:bg-brand-50 sm:px-4 sm:py-1.5 dark:border-white/10 dark:text-brand-200 dark:hover:bg-white/5"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span class="hidden sm:inline">Sign out</span>
          </button>
        }
        <app-theme-toggle />
      </div>
    </div>
  </header>

  <main id="main-content">
    <router-outlet />
  </main>
</div>

<app-toast [message]="notice.message()" [tone]="notice.tone()" (dismissed)="notice.clear()" />
