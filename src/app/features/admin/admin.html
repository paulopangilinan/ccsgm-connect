<section class="mx-auto max-w-3xl px-6 py-16">
  <h1 class="text-2xl font-extrabold">Elder admin</h1>
  <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">
    Members, submissions, and the question builder land here.
  </p>

  <nav class="mt-6 flex gap-2 border-b border-brand-100 dark:border-white/10" aria-label="Admin sections">
    <a
      routerLink="members"
      routerLinkActive
      #membersTab="routerLinkActive"
      class="inline-flex items-center gap-2 border-b-2 px-4 py-2 text-sm transition"
      [class.border-brand-600]="membersTab.isActive"
      [class.font-bold]="membersTab.isActive"
      [class.text-brand-700]="membersTab.isActive"
      [class.dark:text-brand-300]="membersTab.isActive"
      [class.border-transparent]="!membersTab.isActive"
      [class.font-semibold]="!membersTab.isActive"
      [class.text-slate-500]="!membersTab.isActive"
      [class.dark:text-slate-400]="!membersTab.isActive"
    >
      Members
      @if (notifications.pendingCount() > 0) {
        <span
          class="grid min-w-5 place-items-center rounded-full bg-accent-500 px-1.5 text-xs font-bold text-white"
          [attr.aria-label]="notifications.pendingCount() + ' members awaiting approval'"
        >
          {{ notifications.pendingCount() }}
        </span>
      }
    </a>
    <a
      routerLink="submissions"
      routerLinkActive
      #submissionsTab="routerLinkActive"
      class="border-b-2 px-4 py-2 text-sm transition"
      [class.border-brand-600]="submissionsTab.isActive"
      [class.font-bold]="submissionsTab.isActive"
      [class.text-brand-700]="submissionsTab.isActive"
      [class.dark:text-brand-300]="submissionsTab.isActive"
      [class.border-transparent]="!submissionsTab.isActive"
      [class.font-semibold]="!submissionsTab.isActive"
      [class.text-slate-500]="!submissionsTab.isActive"
      [class.dark:text-slate-400]="!submissionsTab.isActive"
    >
      Submissions
    </a>
    <a
      routerLink="birthdays"
      routerLinkActive
      #birthdaysTab="routerLinkActive"
      class="border-b-2 px-4 py-2 text-sm transition"
      [class.border-brand-600]="birthdaysTab.isActive"
      [class.font-bold]="birthdaysTab.isActive"
      [class.text-brand-700]="birthdaysTab.isActive"
      [class.dark:text-brand-300]="birthdaysTab.isActive"
      [class.border-transparent]="!birthdaysTab.isActive"
      [class.font-semibold]="!birthdaysTab.isActive"
      [class.text-slate-500]="!birthdaysTab.isActive"
      [class.dark:text-slate-400]="!birthdaysTab.isActive"
    >
      Birthdays
    </a>
    <a
      routerLink="questions"
      routerLinkActive
      #questionsTab="routerLinkActive"
      class="border-b-2 px-4 py-2 text-sm transition"
      [class.border-brand-600]="questionsTab.isActive"
      [class.font-bold]="questionsTab.isActive"
      [class.text-brand-700]="questionsTab.isActive"
      [class.dark:text-brand-300]="questionsTab.isActive"
      [class.border-transparent]="!questionsTab.isActive"
      [class.font-semibold]="!questionsTab.isActive"
      [class.text-slate-500]="!questionsTab.isActive"
      [class.dark:text-slate-400]="!questionsTab.isActive"
    >
      Questions
    </a>
  </nav>

  <router-outlet />
</section>
