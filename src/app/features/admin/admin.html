<section class="mx-auto max-w-3xl px-6 py-16">
  <h1 class="text-2xl font-extrabold">Elder admin</h1>
  <p class="mt-2 text-sm text-slate-600 dark:text-slate-300">
    Members, submissions, and the question builder land here.
  </p>

  <nav class="mt-6 flex gap-2 border-b border-brand-100 dark:border-white/10" aria-label="Admin sections">
    <a
      routerLink="members"
      routerLinkActive="border-brand-600 bg-brand-50 font-bold text-brand-700 dark:bg-white/10 dark:text-brand-200"
      class="inline-flex items-center gap-2 rounded-t-lg border-b-2 border-transparent px-4 py-2 text-sm font-semibold text-slate-500 transition hover:text-brand-700 dark:text-slate-400 dark:hover:text-brand-200"
    >
      Members
      @if (notifications.pendingCount() > 0) {
        <span
          class="grid min-w-5 place-items-center rounded-full bg-accent-500 px-1.5 text-xs font-bold text-white"
          [attr.aria-label]="notifications.pendingCount() + ' members awaiting approval'"
        >
          {{ notifications.pendingCount() }}
        </span>
      }
    </a>
    <a
      routerLink="submissions"
      routerLinkActive="border-brand-600 bg-brand-50 font-bold text-brand-700 dark:bg-white/10 dark:text-brand-200"
      class="rounded-t-lg border-b-2 border-transparent px-4 py-2 text-sm font-semibold text-slate-500 transition hover:text-brand-700 dark:text-slate-400 dark:hover:text-brand-200"
    >
      Submissions
    </a>
    <a
      routerLink="questions"
      routerLinkActive="border-brand-600 bg-brand-50 font-bold text-brand-700 dark:bg-white/10 dark:text-brand-200"
      class="rounded-t-lg border-b-2 border-transparent px-4 py-2 text-sm font-semibold text-slate-500 transition hover:text-brand-700 dark:text-slate-400 dark:hover:text-brand-200"
    >
      Questions
    </a>
  </nav>

  <router-outlet />
</section>
