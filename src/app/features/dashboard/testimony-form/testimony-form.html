@if (error()) {
  <p role="alert" class="mb-3 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700 dark:bg-red-500/10 dark:text-red-300">
    {{ error() }}
  </p>
}

@if (consentClause()) {
  <p class="mb-2 text-xs text-slate-500 dark:text-slate-400">{{ consentClause() }}</p>
}

<label [attr.for]="'testimony-body'" class="sr-only">Your testimony</label>
<textarea
  id="testimony-body"
  rows="4"
  placeholder="Share what God has done…"
  [value]="body()"
  (input)="body.set($any($event.target).value)"
  class="w-full rounded-xl border border-brand-200 bg-white px-4 py-2 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30 dark:border-white/10 dark:bg-white/5"
></textarea>

<div class="mt-3">
  <label
    class="inline-flex cursor-pointer items-center gap-2 rounded-full border border-brand-200 px-3 py-1.5 text-xs font-semibold text-brand-700 transition hover:bg-brand-50 dark:border-white/10 dark:text-brand-200 dark:hover:bg-white/5"
  >
    Add photos
    <input type="file" accept="image/*" multiple class="sr-only" (change)="onImagesSelected($event)" />
  </label>

  @if (images().length > 0) {
    <ul class="mt-3 flex flex-wrap gap-3">
      @for (image of images(); track image.url; let i = $index) {
        <li class="relative">
          <img [src]="image.url" alt="" class="h-20 w-20 rounded-xl border border-brand-100 object-cover dark:border-white/10" />
          <button
            type="button"
            (click)="removeImage(i)"
            aria-label="Remove image"
            class="absolute -right-2 -top-2 grid h-6 w-6 place-items-center rounded-full bg-red-500 text-xs font-bold text-white shadow"
          >
            ×
          </button>
        </li>
      }
    </ul>
  }
</div>

<div class="mt-4">
  <app-toggle-switch
    [checked]="shareToWebsite()"
    (checkedChange)="setShareToWebsite($event)"
    label="Share this testimony on the CCSGM website"
  />
</div>

@if (shareToWebsite()) {
  <div class="mt-3 ml-6">
    <app-toggle-switch
      [checked]="isAnonymous()"
      (checkedChange)="isAnonymous.set($event)"
      label="Post anonymously — your name won't appear on the website (your elders still see who you are)"
    />
  </div>
}

<div class="mt-4 flex gap-2">
  <button
    type="button"
    [disabled]="!body().trim() || saving()"
    (click)="submit()"
    class="rounded-2xl bg-gradient-to-r from-brand-600 to-accent-500 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:scale-[1.02] disabled:opacity-60 disabled:hover:scale-100"
  >
    {{ saving() ? 'Saving…' : 'Share testimony' }}
  </button>
  <button
    type="button"
    (click)="cancelled.emit()"
    class="rounded-2xl border border-brand-200 px-6 py-2.5 text-sm font-semibold text-brand-700 transition hover:bg-brand-50 dark:border-white/10 dark:text-brand-200 dark:hover:bg-white/5"
  >
    Cancel
  </button>
</div>
