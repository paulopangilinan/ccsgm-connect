<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4" role="dialog" aria-modal="true" aria-label="Take a photo">
  <div class="w-full max-w-md rounded-3xl bg-white p-4 shadow-xl dark:bg-surface-dark">
    @if (error()) {
      <p role="alert" class="rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700 dark:bg-red-500/10 dark:text-red-300">
        {{ error() }}
      </p>
    } @else {
      <div class="overflow-hidden rounded-2xl bg-black">
        <!-- mirror the preview so it feels like a selfie camera -->
        <video #video playsinline muted class="h-auto w-full -scale-x-100"></video>
      </div>
    }

    <div class="mt-4 flex justify-center gap-3">
      @if (!error()) {
        <button
          type="button"
          [disabled]="!ready()"
          (click)="capture()"
          class="rounded-2xl bg-gradient-to-r from-brand-600 to-accent-500 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:scale-[1.02] disabled:opacity-60 disabled:hover:scale-100"
        >
          Capture
        </button>
      }
      <button
        type="button"
        (click)="close()"
        class="rounded-2xl border border-brand-200 px-6 py-2.5 text-sm font-semibold text-brand-700 transition hover:bg-brand-50 dark:border-white/10 dark:text-brand-200 dark:hover:bg-white/5"
      >
        Cancel
      </button>
    </div>
  </div>
</div>
