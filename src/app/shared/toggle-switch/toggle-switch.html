<button
  type="button"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel() || null"
  [disabled]="disabled()"
  (click)="toggle()"
  class="flex items-start gap-3 text-left disabled:opacity-60"
  [class.w-full]="label()"
>
  <span
    class="relative mt-0.5 inline-flex h-5 w-9 shrink-0 items-center rounded-full transition-colors"
    [class.bg-brand-600]="checked()"
    [class.bg-slate-300]="!checked()"
    [class.dark:bg-white/20]="!checked()"
  >
    <span
      class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
      [class.translate-x-4]="checked()"
      [class.translate-x-0.5]="!checked()"
    ></span>
  </span>
  @if (label()) {
    <span class="text-sm text-slate-600 dark:text-slate-300">{{ label() }}</span>
  }
</button>
