<button
  type="button"
  role="switch"
  [attr.aria-checked]="theme.isDark()"
  [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  (click)="theme.toggle()"
  class="relative inline-flex items-center rounded-full bg-brand-100 p-1 dark:bg-slate-800"
>
  <!-- sliding highlight -->
  <span
    class="absolute left-1 top-1 h-7 w-7 rounded-full bg-white shadow-sm transition-transform dark:bg-white/15"
    [class.translate-x-7]="theme.isDark()"
    [class.translate-x-0]="!theme.isDark()"
  ></span>

  <!-- sun -->
  <span class="relative z-10 grid h-7 w-7 place-items-center text-amber-500 dark:text-slate-500">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
    </svg>
  </span>

  <!-- moon -->
  <span class="relative z-10 grid h-7 w-7 place-items-center text-slate-400 dark:text-white">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
    </svg>
  </span>
</button>
