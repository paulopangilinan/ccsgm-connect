<div class="relative">
  <button
    type="button"
    (click)="toggleOpen()"
    [attr.aria-expanded]="open()"
    class="flex w-full items-center justify-between rounded-xl border border-brand-200 bg-white px-4 py-2 text-left text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30 dark:border-white/10 dark:bg-white/5"
  >
    <span [class.text-slate-400]="!hasValue()" [class.dark:text-slate-500]="!hasValue()">{{ label() }}</span>
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-4 w-4 text-brand-600 dark:text-brand-300">
      <rect x="3" y="4" width="18" height="17" rx="2" />
      <path d="M3 9h18M8 2v4M16 2v4" stroke-linecap="round" />
    </svg>
  </button>

  @if (open()) {
    <div class="fixed inset-0 z-20" (click)="close()"></div>

    <div class="absolute z-30 mt-2 w-72 rounded-2xl border border-brand-100 bg-white p-4 shadow-xl dark:border-white/10 dark:bg-surface-dark">
      <div class="flex gap-2">
        <select
          [value]="viewMonth()"
          (change)="setMonth($any($event.target).value)"
          aria-label="Month"
          class="field-select flex-1 rounded-lg border border-brand-200 bg-white py-1.5 pl-3 pr-8 text-sm focus:border-brand-500 focus:outline-none dark:border-white/10 dark:bg-white/5"
        >
          @for (month of months; track month; let i = $index) {
            <option [value]="i">{{ month }}</option>
          }
        </select>
        <select
          [value]="viewYear()"
          (change)="setYear($any($event.target).value)"
          aria-label="Year"
          class="field-select w-24 rounded-lg border border-brand-200 bg-white py-1.5 pl-3 pr-8 text-sm focus:border-brand-500 focus:outline-none dark:border-white/10 dark:bg-white/5"
        >
          @for (year of years; track year) {
            <option [value]="year">{{ year }}</option>
          }
        </select>
      </div>

      <div class="mt-3 grid grid-cols-7 gap-1 text-center text-xs font-semibold text-slate-400 dark:text-slate-500">
        @for (weekday of weekdays; track weekday) {
          <span>{{ weekday }}</span>
        }
      </div>

      <div class="mt-1 grid grid-cols-7 gap-1">
        @for (cell of grid(); track $index) {
          @if (cell === null) {
            <span></span>
          } @else {
            <button
              type="button"
              (click)="select(cell)"
              class="grid h-9 place-items-center rounded-lg text-sm transition"
              [class.bg-brand-600]="isSelected(cell)"
              [class.text-white]="isSelected(cell)"
              [class.font-bold]="isSelected(cell)"
              [class.text-slate-700]="!isSelected(cell)"
              [class.hover:bg-brand-50]="!isSelected(cell)"
              [class.dark:text-slate-200]="!isSelected(cell)"
              [class.dark:hover:bg-white/10]="!isSelected(cell)"
            >
              {{ cell }}
            </button>
          }
        }
      </div>
    </div>
  }
</div>
